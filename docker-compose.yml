
services:
  yugabyte:
    image: yugabytedb/yugabyte:latest
    container_name: disaster-yugabyte
    command:
      - bin/yugabyted
      - start
      - --daemon=false
    ports:
      - "5433:5433"
      - "7001:7000"
    volumes:
      - yugabyte_data:/home/yugabyte/yb_data
    healthcheck:
      test:
        - CMD-SHELL
        - 'ysqlsh -h "$$(hostname -i | awk ''{print $$1}'')" -p 5433 -U yugabyte -d yugabyte -c "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: disaster-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  
  api:
    build: .
    container_name: disaster-rag-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://yugabyte:yugabyte@yugabyte:5433/disaster_db
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./edge-resq-app:/edge-resq-app/app
    depends_on:
      yugabyte:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped


volumes:
  yugabyte_data:
  ollama_data:
